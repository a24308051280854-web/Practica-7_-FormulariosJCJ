<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- Codificación UTF-8: permite acentos y la letra ñ -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Adapta la página al ancho de pantallas móviles -->
<title>Formulario con checkbox</title>
<!-- Título que aparece en la pestaña del navegador -->
</head>
<body>
<h1>Formulario con checkbox</h1>
<p>Casillas de verificación: permiten marcar varias opciones.</p>
<form action="" method="post">
Ingresa tu nombre:
<input type="text" name="nombre"><br>
Selecciona los lenguajes que conozcas:
<br>
<!-- type="checkbox": casilla de verificación. Permite marcar varias opciones a la vez.
     Cada casilla lleva su propio name porque son independientes entre sí. -->
<input type="checkbox" name="Java">Java <br>
<input type="checkbox" name="Python"> Python <br>
<input type="checkbox" name="C#">C# <br>
<input type="checkbox" name="Flutter"> Flutter <br>
<!-- Se agrega un botón de envío, que el original no tenía, para que el formulario sea funcional -->
<input type="submit" value="enviar">
</form>
</body>
<!-- Fin del contenido visible -->
</html>
<!-- Fin del documento HTML -->
