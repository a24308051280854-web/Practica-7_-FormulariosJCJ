<!DOCTYPE html>
<!-- Declara que el documento usa HTML5 -->
<html lang="es">
<!-- <html>: elemento raíz. lang indica el idioma del documento -->
<head>
<meta charset="UTF-8">
<!-- Codificación UTF-8: permite acentos y la letra ñ -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Adapta la página al ancho de pantallas móviles -->
<title>Formulario con limitaciones</title>
<!-- Título que aparece en la pestaña del navegador -->
</head>
<body>
<!-- <body>: contenido visible de la página -->
<h1>Formulario con limitaciones</h1>
<!-- <h1>: título principal de la página -->
<p>Campos deshabilitados, con longitud máxima y de solo lectura.</p>
<form action="" method="post">
Ingresa tu nombre:
<!-- Deshabilitación de campo -->
<input type="text" name="nombre" disabled><br>
<!-- disabled: el campo se ve atenuado, no se puede editar y NO se envía al servidor -->
<!-- Limitación de caracteres -->
Contraseña:
<input type="password" name="pass" maxlength="14"><br>
<!-- maxlength="5": solo permite escribir un máximo de 5 caracteres -->
<!-- Solo lectura -->
Comentarios:
<textarea name="comentarios" readonly>Este es mi comentario y no se puede borrar
</textarea><br>
<!-- readonly: el texto se puede ver y seleccionar, pero no modificar; a diferencia de disabled, SÍ se envía -->
</form>
</body>
<!-- Fin del contenido visible -->
</html>
<!-- Fin del documento HTML -->
