<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- Codificación UTF-8: permite acentos y la letra ñ -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Adapta la página al ancho de pantallas móviles -->
<title>Formulario para contraseñas</title>
</head>
<body>
<h1>Formulario para contraseñas</h1>
<p>Uso de type="password" para ocultar lo que escribe el usuario.</p>
<!-- <p>: párrafo de texto -->
<form action="" method="post">
Ingresa tu usuario:
<input type="text" name="usuario">
<!-- Campo de texto normal para el usuario -->
Ingresa tu contraseña:
<input type="password" name="pass">
<!-- type="password": oculta lo escrito con puntos o asteriscos. Solo es visual, no cifra los datos -->
<br>
<input type="submit" value="enviar">
<input type="reset" value="borrar">
<!-- type="reset": restablece todos los campos del formulario a su valor inicial -->
</form>
</body>
</html>
